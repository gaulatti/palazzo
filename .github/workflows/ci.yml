name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      - name: Build pinned runtime image
        run: docker build --build-arg BUILD_VERSION=${{ github.sha }} --tag palazzo:ci .

      - name: Start and verify pinned runtime
        run: |
          printf 'ci-control-token\n' > /tmp/palazzo-control-token
          docker run --rm --detach --name palazzo-ci \
            --publish 127.0.0.1:3100:3100 \
            --volume /tmp/palazzo-control-token:/run/secrets/palazzo-control-token:ro \
            --env PALAZZO_PORT=3100 \
            --env PALAZZO_INSTANCE_ID=palazzo-ci \
            --env PROGRAM_ID=program-ci \
            --env ICECAST_PORT=8000 \
            --env ICECAST_SOURCE_PASSWORD=ci-password \
            palazzo:ci
          trap 'docker stop palazzo-ci' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3100/playback/state > /tmp/palazzo-state.json \
              && jq --exit-status \
                '.schemaVersion == 1 and .liquidsoap.running == true and .liquidsoap.connected == true and .icecast.connected == true' \
                /tmp/palazzo-state.json > /dev/null; then
              break
            fi
            sleep 1
          done
          jq --exit-status \
            '.schemaVersion == 1 and .liquidsoap.running == true and .liquidsoap.connected == true and .icecast.connected == true' \
            /tmp/palazzo-state.json
          unauthorized_status=$(curl --silent \
            --output /tmp/palazzo-metrics-unauthorized.json \
            --write-out '%{http_code}' \
            http://127.0.0.1:3100/metrics)
          test "$unauthorized_status" = 401
          wrong_token_status=$(curl --silent \
            --output /tmp/palazzo-metrics-wrong-token.json \
            --write-out '%{http_code}' \
            --header 'Authorization: Bearer wrong-ci-token' \
            http://127.0.0.1:3100/metrics)
          test "$wrong_token_status" = 401
          curl --fail --silent \
            --dump-header /tmp/palazzo-metrics-headers.txt \
            --header 'Authorization: Bearer ci-control-token' \
            http://127.0.0.1:3100/metrics \
            > /tmp/palazzo-metrics.txt
          grep --ignore-case 'content-type: text/plain; version=0.0.4' \
            /tmp/palazzo-metrics-headers.txt
          node test/verify-prometheus-exposition.js /tmp/palazzo-metrics.txt
          if grep --extended-regexp 'program-ci|ci-control-token|wrong-ci-token' /tmp/palazzo-metrics.txt; then
            echo 'metrics exposed private identifiers or credentials'
            exit 1
          fi
          curl --fail --silent \
            --header 'Authorization: Bearer ci-control-token' \
            --header 'Idempotency-Key: ci-start' \
            --header 'X-Command-Sequence: 1' \
            --request POST \
            http://127.0.0.1:3100/v1/programs/program-ci/automation/start \
            | jq --exit-status '.actualState == "ready" and .readiness == true and .playback.status == "idle"'
          curl --fail --silent \
            --header 'Authorization: Bearer ci-control-token' \
            --header 'Idempotency-Key: ci-stop' \
            --header 'X-Command-Sequence: 2' \
            --request POST \
            http://127.0.0.1:3100/v1/programs/program-ci/automation/stop \
            | jq --exit-status '.actualState == "stopped" and .dependencies.icecast == true'
          docker exec palazzo-ci liquidsoap --version | grep 'Liquidsoap 2.4.5'
