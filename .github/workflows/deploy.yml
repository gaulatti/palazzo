name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.DEPLOYMENT_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            --build-arg BUILD_VERSION=${{ github.sha }} \
            -t ghcr.io/${{ github.repository }}/palazzo:${{ github.sha }} \
            -t ghcr.io/${{ github.repository }}/palazzo:latest \
            .

      - name: Push Docker image to GHCR
        run: |
          docker push ghcr.io/${{ github.repository }}/palazzo:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/palazzo:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Deploy to on-premises host
        if: vars.ON_PREMISES == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            sh -c '
            set -eu

            test -n "${{ vars.PROGRAM_ID }}"
            docker network inspect broadcast-control >/dev/null
            test -s /etc/palazzo/control-token
            docker volume create palazzo-fillers >/dev/null
            if docker inspect palazzo-candidate >/dev/null 2>&1 || docker inspect palazzo-rollback >/dev/null 2>&1; then
              echo "A previous Palazzo deployment candidate or rollback container requires operator review"
              exit 1
            fi

            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.DEPLOYMENT_TOKEN }}
            IMAGE=ghcr.io/${{ github.repository }}/palazzo:${{ github.sha }}
            docker pull "$IMAGE"

            cleanup_candidate() {
              docker rm -f palazzo-candidate >/dev/null 2>&1 || true
            }
            trap cleanup_candidate EXIT

            docker run -d --name palazzo-candidate \
              --network broadcast-control \
              --volume /etc/palazzo/control-token:/run/secrets/palazzo-control-token:ro \
              -e PALAZZO_PORT=3100 \
              -e PALAZZO_INSTANCE_ID=palazzo-production-candidate \
              -e PROGRAM_ID="${{ vars.PROGRAM_ID }}" \
              -e PALAZZO_CONTROL_TOKEN_FILE=/run/secrets/palazzo-control-token \
              -e ICECAST_PORT=8000 \
              -e ICECAST_SOURCE_PASSWORD="${{ secrets.ICECAST_SOURCE_PASSWORD }}" \
              "$IMAGE"

            candidate_ready=false
            for attempt in $(seq 1 45); do
              if docker exec palazzo-candidate node -e "fetch(\"http://127.0.0.1:3100/playback/state\").then(async response=>{const state=await response.json();if(!response.ok||state.liquidsoap?.running!==true||state.liquidsoap?.connected!==true||state.icecast?.connected!==true)throw new Error(\"transport not ready\")}).catch(error=>{console.error(error.message);process.exit(1)})"; then
                candidate_ready=true
                break
              fi
              sleep 2
            done
            if [ "$candidate_ready" != true ]; then
              echo "Palazzo candidate failed its transport and lifecycle checks"
              docker logs --tail 200 palazzo-candidate || true
              exit 1
            fi

            cleanup_candidate
            trap - EXIT

            rollback_available=false
            if docker inspect palazzo >/dev/null 2>&1; then
              docker stop palazzo
              docker rename palazzo palazzo-rollback
              rollback_available=true
            fi

            if ! docker run -d --name palazzo \
              --network broadcast-control \
              --volume /etc/palazzo/control-token:/run/secrets/palazzo-control-token:ro \
              -p 127.0.0.1:${{ vars.PALAZZO_PORT }}:3100 \
              -p 127.0.0.1:${{ vars.ICECAST_PORT }}:8000 \
              -e PALAZZO_PORT=3100 \
              -e PALAZZO_INSTANCE_ID=palazzo-production \
              -e PROGRAM_ID="${{ vars.PROGRAM_ID }}" \
              -e PALAZZO_CONTROL_TOKEN_FILE=/run/secrets/palazzo-control-token \
              -e ICECAST_PORT=8000 \
              -e ICECAST_SOURCE_PASSWORD="${{ secrets.ICECAST_SOURCE_PASSWORD }}" \
              --volume palazzo-fillers:/var/lib/palazzo/fillers \
              --restart=always \
              "$IMAGE"; then
              docker rm -f palazzo >/dev/null 2>&1 || true
              if [ "$rollback_available" = true ]; then
                docker rename palazzo-rollback palazzo
                docker start palazzo
              fi
              exit 1
            fi

            deployed_ready=false
            for attempt in $(seq 1 45); do
              if docker exec palazzo node -e "fetch(\"http://127.0.0.1:3100/playback/state\").then(async response=>{const state=await response.json();if(!response.ok||state.liquidsoap?.running!==true||state.liquidsoap?.connected!==true||state.icecast?.connected!==true)throw new Error(\"transport not ready\")}).catch(error=>{console.error(error.message);process.exit(1)})"; then
                deployed_ready=true
                break
              fi
              sleep 2
            done
            if [ "$deployed_ready" != true ]; then
              echo "Palazzo deployment failed its transport and lifecycle checks; rolling back"
              docker logs --tail 200 palazzo || true
              docker rm -f palazzo || true
              if [ "$rollback_available" = true ]; then
                docker rename palazzo-rollback palazzo
                docker start palazzo
              fi
              exit 1
            fi

            if [ "$rollback_available" = true ]; then
              docker rm palazzo-rollback
            fi
            '

      - name: Configure AWS credentials
        if: vars.ON_PREMISES != 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::792025092931:role/palazzo-github-deploy

      - name: Deploy to Cumulus through SSM
        if: vars.ON_PREMISES != 'true'
        env:
          DEPLOYMENT_TOKEN: ${{ secrets.DEPLOYMENT_TOKEN }}
        run: |
          set -euo pipefail
          INSTANCE_IDS="$(aws ec2 describe-instances \
            --filters Name=tag:Name,Values=macondo-services Name=instance-state-name,Values=running \
            --query 'Reservations[].Instances[].InstanceId' \
            --output json)"
          if [ "$(jq 'length' <<<"$INSTANCE_IDS")" -ne 1 ]; then
            echo 'Expected exactly one running Macondo service host'
            exit 1
          fi
          CUMULUS_INSTANCE_ID="$(jq -r '.[0]' <<<"$INSTANCE_IDS")"

          stack_output() {
            aws cloudformation describe-stacks \
              --stack-name MacondoStack \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue | [0]" \
              --output text
          }
          BROADCAST_SECRET_ID="$(stack_output MacondoStackBroadcastRuntimeSecretArn)"
          ICECAST_SECRET_ID="$(stack_output MacondoStackIcecastSourceSecretArn)"
          CUMULUS_PUBLIC_IP="$(stack_output MacondoStackServicePublicIp)"
          HOSTED_ZONE_ID="$(stack_output MacondoStackHostedZoneId)"
          for value in "$BROADCAST_SECRET_ID" "$ICECAST_SECRET_ID" "$CUMULUS_PUBLIC_IP" "$HOSTED_ZONE_ID"; do
            test -n "$value"
            test "$value" != None
          done

          DNS_CHANGE="$(jq -cn \
            --arg ip "$CUMULUS_PUBLIC_IP" \
            '{Changes:[{Action:"UPSERT",ResourceRecordSet:{Name:"palazzo.gaulatti.com",Type:"A",TTL:60,ResourceRecords:[{Value:$ip}]}}]}')"
          DNS_CHANGE_ID="$(aws route53 change-resource-record-sets \
            --hosted-zone-id "$HOSTED_ZONE_ID" \
            --change-batch "$DNS_CHANGE" \
            --query ChangeInfo.Id \
            --output text)"
          aws route53 wait resource-record-sets-changed --id "$DNS_CHANGE_ID"

          SCRIPT_BASE64="$(base64 -w 0 deploy/cumulus.sh)"
          NGINX_BASE64="$(base64 -w 0 deploy/cumulus.nginx.conf)"
          TOKEN_BASE64="$(printf '%s' "$DEPLOYMENT_TOKEN" | base64 -w 0)"
          REMOTE_COMMAND="$(jq -nr \
            --arg script "$SCRIPT_BASE64" \
            --arg user "$GITHUB_ACTOR" \
            --arg token "$TOKEN_BASE64" \
            --arg broadcastSecret "$BROADCAST_SECRET_ID" \
            --arg icecastSecret "$ICECAST_SECRET_ID" \
            --arg image "ghcr.io/${GITHUB_REPOSITORY}/palazzo:${GITHUB_SHA}" \
            --arg nginx "$NGINX_BASE64" \
            --arg programId "${{ vars.PROGRAM_ID }}" \
            '[
              "printf %s " + ($script | @sh) + " | base64 -d > /tmp/deploy-palazzo.sh",
              "chmod 0700 /tmp/deploy-palazzo.sh",
              "/tmp/deploy-palazzo.sh " + ([$user, $token, $broadcastSecret, $icecastSecret, $image, $nginx, $programId] | map(@sh) | join(" ")),
              "rm -f /tmp/deploy-palazzo.sh"
            ] | join("\n")')"
          PARAMETERS="$(jq -cn --arg command "$REMOTE_COMMAND" '{commands:[$command],executionTimeout:["600"]}')"
          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$CUMULUS_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment 'Deploy Palazzo to Cumulus' \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)"

          for _ in $(seq 1 120); do
            COMMAND_STATUS="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$CUMULUS_INSTANCE_ID" \
              --query Status \
              --output text)"
            case "$COMMAND_STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$CUMULUS_INSTANCE_ID" \
                  --query StandardOutputContent \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$CUMULUS_INSTANCE_ID" \
                  --query '{Output:StandardOutputContent,Error:StandardErrorContent}' \
                  --output json
                exit 1
                ;;
            esac
            sleep 5
          done
          echo 'Timed out waiting for Palazzo deployment'
          exit 1
