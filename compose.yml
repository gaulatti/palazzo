name: palazzo

services:
  palazzo:
    build:
      context: .
    env_file: .env
    environment:
      - ICECAST_PORT=${ICECAST_PORT:-8000}
      - ICECAST_SOURCE_PASSWORD=${ICECAST_SOURCE_PASSWORD:-palazzo-source}
    ports:
      - "127.0.0.1:${ICECAST_PORT:-8000}:${ICECAST_PORT:-8000}"
    volumes:
      - ./src:/app/src
      - ./nest-cli.json:/app/nest-cli.json
    command: npm run start:dev
    restart: unless-stopped
