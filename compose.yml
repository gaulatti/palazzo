name: palazzo

services:
  palazzo:
    build:
      context: .
    env_file: .env
    environment:
      - PALAZZO_PORT=3100
      - PALAZZO_INSTANCE_ID=${PALAZZO_INSTANCE_ID:-palazzo-local}
      - PROGRAM_ID=${PROGRAM_ID:-program-local}
      - PALAZZO_CONTROL_TOKEN_FILE=/run/secrets/palazzo-control-token
      - LIFECYCLE_TRANSITION_TIMEOUT_MS=${LIFECYCLE_TRANSITION_TIMEOUT_MS:-5000}
      - ICECAST_PORT=${ICECAST_PORT:-8000}
      - ICECAST_SOURCE_PASSWORD=${ICECAST_SOURCE_PASSWORD:-palazzo-source}
    ports:
      - "127.0.0.1:${PALAZZO_PORT:-3100}:3100"
      - "127.0.0.1:${ICECAST_PORT:-8000}:${ICECAST_PORT:-8000}"
    develop:
      watch:
        - action: rebuild
          path: ./src
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./tsconfig.json
        - action: rebuild
          path: ./tsconfig.build.json
    restart: unless-stopped
    secrets:
      - palazzo-control-token
    networks:
      - default
      - broadcast-control
    volumes:
      - palazzo-fillers:/var/lib/palazzo/fillers

secrets:
  palazzo-control-token:
    file: ${PALAZZO_CONTROL_TOKEN_FILE:-./secrets/palazzo-control-token}

networks:
  broadcast-control:
    external: true

volumes:
  palazzo-fillers:
